[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fucc"
version = "0.0.4"
description = "Fix You, Claude Code — Ubuntu local Claude environment management"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = ["jcs==0.2.1", "wcwidth>=0.2.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
fucc = "fucc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
